<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>温柔朗读</title>
<link rel="stylesheet" href="../shared/hub.css?v=20261116f">
<style>
.up{border:2px dashed #c3d8f6;border-radius:12px;padding:20px;text-align:center;color:#6b7b91;font-size:13.5px;background:#f9fcff;cursor:pointer}
.up.hot{border-color:#1a6ee0;background:#f0f6ff}
textarea.big{min-height:190px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="backbar"><a class="back" href="../个人中控台.html">← 返回中控台</a><a class="back plus" href="memo.html">🔔 备忘</a></div>
  <div class="hd">
    <h1>🎧 温柔朗读</h1>
    <div class="sub">文字 / 图片 / 文档转语音 · 温柔桃子与广东话仔</div>
  </div>
  <div class="syncbar">
    <div class="sync" data-sync-badge><span class="dot"></span>检测中…</div>
    <button class="btn-mini" id="btnSync">同步设置</button>
  </div>

  <div class="panel">
    <div class="panel-title">① 文件上传（图片自动取字）</div>
    <div class="up" id="drop">
      拖拽文件到此处，或点击选择<br>
      <span style="font-size:12px;color:#98a4b5">支持 jpg / png / webp / bmp / gif / txt，最大 20MB</span>
    </div>
    <input type="file" id="file" accept="image/*,.txt" hidden>
    <div class="hint" id="upState"></div>
  </div>

  <div class="panel">
    <div class="panel-title"><span>② 文字内容</span><span class="grow"></span>
      <button class="btn sm gray" id="btnPaste">粘贴</button>
      <button class="btn sm gray" id="btnCopy">复制</button>
      <button class="btn sm gray" id="btnClear">清空</button>
    </div>
    <textarea class="big" id="txt" placeholder="在此输入或粘贴文字。上传图片会自动识别后填进来；识别不动的时候，把文字粘到这里一样能读。"></textarea>
    <div class="hint" id="txtInfo">0 字</div>
  </div>

  <div class="panel">
    <div class="panel-title">③ 语音朗读</div>
    <div class="form-grid three">
      <div><label class="f">音色</label><select id="voice">
        <option value="peach">温柔桃子（甜美女声）</option>
        <option value="cantonese">广东话仔（粤语男声）</option>
      </select></div>
      <div><label class="f">语速</label><select id="rate">
        <option value="0.5">0.5x</option><option value="0.8">0.8x</option>
        <option value="1" selected>1.0x 正常</option>
        <option value="1.2">1.2x</option><option value="1.5">1.5x</option>
      </select></div>
      <div><label class="f">语调</label><select id="tone">
        <option value="normal" selected>正常</option><option value="low">低沉</option>
        <option value="bright">明亮</option><option value="high">高亢</option>
      </select></div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="btnSpeak">开始朗读</button>
      <button class="btn ghost" id="btnPause">暂停</button>
      <button class="btn ghost" id="btnResume">继续</button>
      <button class="btn gray" id="btnStop">停止</button>
    </div>
    <div class="hint" id="speakState">用的是浏览器系统中文语音包。原站的「妙搭平台音色插件」是云能力，静态网页调不到，所以这里如实降级。</div>
  </div>

  <div class="footer-f">原站依赖妙搭平台 AI（音色合成 / 图片 OCR / 文档解析），静态部署后只有 UI、文字编辑与系统音色可用 —— 本页照此降级，并明确标出</div>
</div>

<a class="pill" href="memo.html">🔔 备忘提醒</a>

<script src="../data/seed.js?v=20261116f"></script>
<script src="../shared/hub.js?v=20261116f"></script>
<script src="https://fastly.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" defer></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var PITCH = { normal:1, low:0.8, bright:1.15, high:1.3 };

  function txtInfo(){
    var n = $('txt').value.length;
    $('txtInfo').textContent = n + ' 字' + (n ? ' · 约 ' + Math.max(1, Math.round(n/240)) + ' 分钟读完' : '');
  }
  $('txt').oninput = txtInfo;

  $('btnPaste').onclick = function(){
    navigator.clipboard.readText().then(function(t){
      if (!t){ HUB.toast('剪贴板为空'); return; }
      $('txt').value = ($('txt').value ? $('txt').value + '\n' : '') + t;
      txtInfo(); HUB.toast('已粘贴');
    }, function(){ HUB.toast('浏览器不让读剪贴板，请按 Ctrl+V 手动粘'); });
  };
  $('btnCopy').onclick = function(){
    navigator.clipboard.writeText($('txt').value).then(function(){ HUB.toast('已复制到剪贴板'); },
      function(){ HUB.toast('复制失败'); });
  };
  $('btnClear').onclick = function(){ $('txt').value = ''; txtInfo(); };

  /* ---- 文件上传 ---- */
  $('drop').onclick = function(){ $('file').click(); };
  ['dragenter','dragover'].forEach(function(ev){
    $('drop').addEventListener(ev, function(e){ e.preventDefault(); $('drop').classList.add('hot'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    $('drop').addEventListener(ev, function(e){ e.preventDefault(); $('drop').classList.remove('hot'); });
  });
  $('drop').addEventListener('drop', function(e){
    var f = e.dataTransfer.files[0]; if (f) handleFile(f);
  });
  $('file').onchange = function(){ if (this.files[0]) handleFile(this.files[0]); };

  function handleFile(f){
    if (f.size > 20 * 1024 * 1024){ HUB.toast('文件最大 20MB'); return; }
    $('upState').textContent = '正在处理：' + f.name;
    if (f.type.indexOf('image') === 0){
      $('upState').textContent = '正在识别文字：' + f.name;
      if (typeof Tesseract === 'undefined'){
        $('upState').innerHTML = '⚠️ OCR 引擎（tesseract.js）还没加载成功，可能没联网。可以先把文字粘到上面文本框用系统音色朗读。';
        return;
      }
      Tesseract.recognize(f, 'chi_sim+eng', { logger:function(m){
        if (m.status) $('upState').textContent = '识别中：' + m.status + (m.progress ? ' ' + Math.round(m.progress*100) + '%' : '');
      }}).then(function(res){
        var t = (res.data.text || '').trim();
        if (!t){ $('upState').textContent = '未识别到文字内容，请确认图片清晰且包含文字'; return; }
        $('txt').value = ($('txt').value ? $('txt').value + '\n' : '') + t;
        txtInfo();
        $('upState').textContent = '已识别 ' + t.length + ' 字，填进下方文本框（可先改再读）';
        HUB.toast('取字完成');
      }).catch(function(e){
        $('upState').textContent = '识别失败：' + e.message + '（可把文字粘到文本框用系统音色朗读）';
      });
      return;
    }
    if (f.name.toLowerCase().endsWith('.txt') || f.type === 'text/plain'){
      var fr = new FileReader();
      fr.onload = function(){
        $('txt').value = ($('txt').value ? $('txt').value + '\n' : '') + String(fr.result);
        txtInfo(); $('upState').textContent = '已读入文本 ' + f.name;
      };
      fr.readAsText(f, 'utf-8');
      return;
    }
    if (f.name.toLowerCase().endsWith('.pdf') || f.name.toLowerCase().endsWith('.doc') || f.name.toLowerCase().endsWith('.docx')){
      $('upState').innerHTML = '⚠️ <b>' + HUB.esc(f.name) + '</b> 属于文档解析（原站调妙搭 doc_text_parser 能力），静态网页没有这个接口。'
        + '请把内容复制粘贴到上面文本框，或转成 txt 再上传。';
      return;
    }
    $('upState').textContent = '不支持的文件格式，请上传图片（jpg/png/webp）或 txt';
  }

  /* ---- 朗读（浏览器系统音色） ---- */
  var speaking = false;
  function pickVoice(kind){
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    if (!vs.length) return null;
    var want = kind === 'cantonese' ? ['zh-HK','zh-TW','yue','zh'] : ['zh-CN','zh-SG','zh'];
    for (var i=0;i<want.length;i++){
      var hit = vs.filter(function(v){ return v.lang && v.lang.replace('_','-').indexOf(want[i]) === 0; })[0];
      if (hit) return hit;
    }
    return vs.filter(function(v){ return /chinese|中文|普通话|粤/i.test(v.name + ' ' + v.lang); })[0] || vs[0];
  }
  function speak(){
    var t = $('txt').value.trim();
    if (!t){ HUB.toast('先输入或粘贴文字'); return; }
    if (!window.speechSynthesis){ $('speakState').textContent = '这个浏览器不支持语音合成'; return; }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t);
    var v = pickVoice($('voice').value);
    if (v){ u.voice = v; u.lang = v.lang; }
    else if ($('voice').value === 'cantonese') u.lang = 'zh-HK';
    else u.lang = 'zh-CN';
    u.rate = Number($('rate').value) || 1;
    u.pitch = PITCH[$('tone').value] || 1;
    u.onstart = function(){ speaking = true; $('speakState').textContent = '正在朗读…（音色：' + (v ? v.name : '系统默认') + '）'; };
    u.onend = function(){ speaking = false; $('speakState').textContent = '朗读结束'; };
    u.onerror = function(e){ speaking = false; $('speakState').textContent = '播放失败：' + (e.error||'未知') + '，请检查设备是否装有中文语音包'; };
    speechSynthesis.speak(u);
    if (!v && $('voice').value === 'cantonese'){
      $('speakState').textContent = '系统里没找到粤语语音包，已改用默认中文音色朗读';
    }
  }
  $('btnSpeak').onclick = speak;
  $('btnPause').onclick = function(){ if (speechSynthesis.speaking) { speechSynthesis.pause(); $('speakState').textContent = '已暂停'; } };
  $('btnResume').onclick = function(){ if (speechSynthesis.paused) { speechSynthesis.resume(); $('speakState').textContent = '继续朗读'; } };
  $('btnStop').onclick = function(){ speechSynthesis.cancel(); speaking = false; $('speakState').textContent = '已停止'; };

  if (window.speechSynthesis) speechSynthesis.onvoiceschanged = function(){ /* 触发一次取列表 */ };
  $('btnSync').onclick = HUB.openSyncDialog;
  txtInfo();
})();
</script>
</body>
</html>
