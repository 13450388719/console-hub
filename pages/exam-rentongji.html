<style>

.btn{font:inherit;font-size:13px;padding:8px 14px;border-radius:9px;border:1px solid #d5dbe5;background:#fff;color:#3c5171;cursor:pointer}

@media(min-width:820px){.two{grid-template-columns:1fr 1fr;align-items:start}}
.col{background:#fff;border:1px solid #e6ecf5;border-radius:11px;padding:10px 11px}

.colh.bad{color:#c23c3c}
.oo{font-size:12.5px;color:#40536e;line-height:1.55;margin:3px 0 0 2px}
.ansline{font-size:12px;color:#0b7a4b;background:#eaf7f0;border-radius:7px;padding:5px 8px;margin:7px 0 3px}
.expl{font-size:11.5px;color:#6b7c93;line-height:1.55;margin:3px 0 4px}
.ro{font-size:13px;line-height:1.55;padding:7px 10px;margin:5px 0;border:1px solid #e0e7f2;border-radius:8px;background:#fbfcfe;color:#40536e}
.ro.ok{border-color:#0b7a4b;background:#eaf7f0;color:#0b7a4b;font-weight:600}
.ro.mine{border-color:#c0392b;background:#fdeceb;color:#c0392b}
.note2{width:100%;box-sizing:border-box;font:inherit;font-size:12.5px;line-height:1.5;padding:8px 9px;border:1px solid #e0e7f2;border-radius:8px;background:#fbfcfe;color:#2b3f5c;min-height:44px;resize:vertical;margin-top:6px}
.svd{font-size:11px;color:#178a53;margin-left:6px}
.note{width:100%;box-sizing:border-box;font:inherit;font-size:13px;line-height:1.5;padding:9px 10px;border:1px solid #e0e7f2;border-radius:9px;background:#fbfcfe;color:#2b3f5c;min-height:70px;resize:vertical}
.meta{font-size:11.5px;color:#93a1b4;line-height:1.6;margin-top:8px}
.wbad,.wok{display:inline-block;font-size:11px;border-radius:6px;padding:2px 6px;margin-left:6px}
.wbad{color:#c23c3c;background:#fdeeee}
.wok{color:#178a53;background:#eaf7f0}
.wq{font-size:12px;color:#6b7c93;margin:6px 0 4px;line-height:1.55}
.wline{font-size:11.5px;margin:2px 0}
.wt{display:inline-block;width:16px;color:#93a1b4}
.wt.bad{color:#c23c3c}
.wt.ok{color:#178a53}
.wd{display:inline-block;background:#f4f7fc;border-radius:5px;padding:1px 6px;margin:2px 4px 2px 0;color:#5c6f88}
.hist{margin:6px 0 0;padding-left:16px;font-size:11.5px;color:#7c8ca3;line-height:1.6}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:12px}
.pill2{font-size:11px;color:#5b6d86;background:#f1f5fb;border-radius:20px;padding:3px 10px}
.empty{color:#93a1b4;font-size:13px;padding:26px 0;text-align:center}
.kp{background:#fff;border:1px solid #e6ecf5;border-radius:10px;margin-top:8px;overflow:hidden}
.kp .hd2{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;cursor:pointer;font-size:13.5px;color:#22354f}
.kp .hd2 b{font-weight:600}
.kp .cnt{font-size:12px;color:#1a6ee0;background:#eef4ff;border-radius:20px;padding:2px 9px}

.kp.open .body2{display:block}

.kp .qi{font-size:12.5px;color:#3c5171;line-height:1.5;padding:4px 0 4px 8px;border-left:2px solid #e6ecf5;margin-bottom:4px}

  <div class="hd">

  <div id="stage"><div class="empty">点「开始一组」开练。每组现抽 12 题、每份卷各出 1 题，组不存档；档位与笔记跟着每一题走。</div></div>
  <footer style="text-align:center;color:#9aa8bb;font-size:11px;margin-top:28px">
    组是临时的，档位是永久的 · 答对升一档，15 天档答对即毕业；答错不管在哪档都回 1 天档
  </footer>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var PAD = HUB.pad2;
  function today(){ return HUB.todayStr ? HUB.todayStr() : new Date().toISOString().slice(0,10); }
  function addDays(dayStr, n){
    var d = new Date(dayStr + 'T00:00:00'); d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + PAD(d.getMonth()+1) + '-' + PAD(d.getDate());
  }
  var LV = [1,3,7,15];           // 档位间隔（天）；lv 0=1天 1=3天 2=7天 3=15天，从 15 天档答对即毕业（lv=4）
  var GRAD = 4;

  /* ---------- 数据 ---------- */
  var D = HUB.get('exam', null) || {};
  if (!D.prog) D.prog = {};
  if (!D.notes) D.notes = {};
  if (!D.bank) D.bank = [];
  function save(){ HUB.set('exam', D); }
  var FILE_BANK = { items: [] };

  function items(){
    var a = (FILE_BANK.items || []).concat(D.bank || []);
    var seen = {}, out = [];
    a.forEach(function(q){ if (q && q.id && !seen[q.id]){ seen[q.id] = 1; out.push(q); } });
    return out;
  }
  function byId(id){ var l = items(); for (var i=0;i<l.length;i++) if (l[i].id===id) return l[i]; return null; }
  function progOf(id){
    if (!D.prog[id]) D.prog[id] = { lv:0, due:today(), last:'', hist:[] };
    if (!D.prog[id].hist) D.prog[id].hist = [];
    return D.prog[id];
  }

  /* ---------- 统计 ---------- */
  function stats(){
    var all = items(), practiced = 0, due = 0, grad = 0, t = today();
    Object.keys(D.prog).forEach(function(id){
      var p = D.prog[id]; if (!p) return;
      practiced++;
      if (p.lv >= GRAD) grad++;
      else if (p.due && p.due <= t) due++;
    });
    $('sBank').textContent = all.length || '—';
    $('sDone').textContent = practiced;
    $('sDue').textContent = due;
    $('sGrad').textContent = grad;
  }


  /* ---------- 旧数据迁移：修正历史里被算坏的档位 ---------- */
  function migrate(){
    var changed = false;
    Object.keys(D.prog || {}).forEach(function(id){
      var p = D.prog[id]; if (!p) return;
      if (p.lv > 4){ p.lv = 4; changed = true; }
      if (p.lv >= 4 && p.due !== ''){ p.lv = 4; p.due = ''; changed = true; }
      if (p.lv < 4 && (!p.due || String(p.due).indexOf('NaN') >= 0)){ p.due = today(); changed = true; }
    });
    if (changed) save();
  }

  /* ---------- 抽题：按卷摊平，每份卷各出 1 题 ---------- */
  var N = 12;
  function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var x=a[i];a[i]=a[j];a[j]=x; } return a; }
  function balance(pool, n){
    var by = {}, years = [];
    pool.forEach(function(q){ var y = q.paper || (q.id||'').split('_')[0] || '未知'; if (!by[y]){ by[y]=[]; years.push(y); } by[y].push(q); });
    years = years.sort();
    years.forEach(function(y){ by[y] = shuffle(by[y]); });
    var out = [], used = {};
    while (out.length < n){
      var added = false;
      var round = out.length === 0 ? 1 : 2;   // 第 1 轮：每份卷只出 1 题；不足再从有余额的卷补
      for (var i=0;i<years.length;i++){
        var y = years[i];
        if (!by[y] || !by[y].length) continue;
        if (round === 1 && used[y]) continue;
        used[y] = 1;
        out.push(by[y].shift()); added = true; if (out.length >= n) break;
      }
      if (!added) break;
    }
    return out;
  }
  /* 每份卷最多 1 题：同卷重复出现的丢掉，先出现的优先 */
  function onePerPaper(list){
    var seen = {}, out = [];
    list.forEach(function(q){ var k = q.paper || (q.id||'').split('_')[0] || '未知'; if (seen[k]) return; seen[k] = 1; out.push(q); });
    return out;
  }

  function pickSession(mock){
    var all = items(), t = today();
    if (mock){
      var practiced = all.filter(function(q){ return D.prog[q.id]; });
      return { qs: onePerPaper(balance(practiced, N)), mock:true };
    }
    var dueQ = [], fresh = [], later = [];
    all.forEach(function(q){
      var p = D.prog[q.id];
      if (!p) fresh.push(q);
      else if (p.lv >= GRAD) { /* 毕业不再出现 */ }
      else if (p.due && p.due <= t) dueQ.push(q);
      else later.push(q);
    });
    var a = onePerPaper(balance(dueQ, N).concat(balance(fresh, N)).concat(balance(later, N)));
    if (a.length < N){
      var have = {}; a.forEach(function(q){ have[q.id] = 1; });
      var extra = shuffle(all.filter(function(q){ if (have[q.id]) return false; var p = D.prog[q.id]; return !(p && p.lv >= GRAD); }));
      a = a.concat(extra.slice(0, N - a.length));
    }
    return { qs: a, mock:false };
  }

  /* ---------- 会话状态 ---------- */
  var S = { mode:'idle', mock:false, qs:[], cur:0, ans:{}, judged:{}, result:null };
  var STATE = 'exam';   // study | exam（默认考试态）

  function startSession(mock){
    var p = pickSession(mock);
    if (!p.qs.length){
      alert(mock ? '还没有练过的题，先做一组练习再来模拟考。' : '题库是空的：先「导入题库」或等题库灌进来。');
      return;
    }
    S = { mode:'run', mock:!!mock, qs:p.qs, cur:0, ans:{}, judged:{}, result:null };
    if (mock) setState('exam');
    render();
  }

  function setState(s){
    STATE = s;
    Array.prototype.forEach.call($('tgState').querySelectorAll('button'), function(b){
      b.className = (b.dataset.s === s) ? 'on' : '';
    });
  }
  $('tgState').onclick = function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (S.mode === 'run' && S.mock) return;            // 模拟考固定考试状态
    setState(b.dataset.s === 'exam' ? 'exam' : 'study');
    render();
  };

  /* ---------- 判题 ---------- */
  function normAns(a){ return String(a||'').toUpperCase().replace(/[^A-D]/g,'').split('').sort().join(''); }
  function sameSet(chosen, correct){ return normAns(chosen) === normAns(correct); }

  function applyResult(q, ok){
    var p = progOf(q.id);
    var from = p.lv, lv = p.lv;
    if (ok){
      lv = from + 1;
      if (from >= 3) lv = GRAD;                        // 15 天档（lv=3）答对 → 毕业
      if (lv > GRAD) lv = GRAD;
      p.due = (lv >= GRAD) ? '' : addDays(today(), LV[lv]);
    } else {
      lv = 0;
      p.due = addDays(today(), LV[0]);
    }
    p.lv = lv; p.last = today();
    p.hist.push({ d: today(), ok: ok ? 1 : 0, from: from, to: lv });
    save(); stats();
  }

  function judgeNow(q, ok, mock){
    if (mock){                                        // 模拟考不升降档
      var p = progOf(q.id); p.last = today();
      p.hist.push({ d: today(), ok: ok ? 1 : 0, from: p.lv, to: p.lv, mock: 1 });
      save();
      return;
    }
    applyResult(q, ok);
  }

  /* ---------- 渲染 ---------- */
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function lvName(lv){ return lv >= GRAD ? '毕业' : (LV[lv] + ' 天档'); }

  function render(){
    stats();
    var st = $('stage');
    if (S.mode === 'kp'){ st.innerHTML = renderKp(); bindKp(); return; }
    if (S.mode === 'done'){ st.innerHTML = renderDone(); bindKp(); bindNotes(); return; }
    if (S.mode === 'idle'){ return; }
    if (S.result){ st.innerHTML = renderResult(); bindResult(); return; }
    st.innerHTML = renderQuestion();
    bindQuestion();
  }

  function renderQuestion(){
    var q = S.qs[S.cur], p = D.prog[q.id], judged = S.judged[q.id];
    var typeName = { single:'单选题', multi:'多选题', judge:'判断题', essay:'问答题' }[q.type] || '题目';
    var opts = (q.opts || []).map(function(o){
      var L = o[0], T = o.slice(1);
      var cls = 'opt';
      if (S.ans[q.id] && S.ans[q.id].indexOf(L) >= 0) cls += ' sel';
      if (judged && q.ans){
        if (q.ans.indexOf(L) >= 0) cls = 'opt ok';
        else if (S.ans[q.id] && S.ans[q.id].indexOf(L) >= 0) cls = 'opt bad';
      }
      return '<button class="' + cls + '" data-l="' + L + '"' + (judged ? ' disabled' : '') + '>' + esc(o) + '</button>';
    }).join('');

    var res = '';
    if (judged){
      if (judged.ok === null) res = '<div class="res nd">这一题缺标准答案，请自评：' +
        '<button class="btn" data-self="1">算对</button> <button class="btn" data-self="0">算错</button></div>';
      else res = '<div class="res ' + (judged.ok ? 'ok' : 'bad') + '">' + (judged.ok ? '✅ 答对' : '❌ 答错') +
        '　正确答案：' + (q.ans || '（缺）') + '</div>';
    } else if (STATE === 'study' && !q.ans){
      res = '<div class="res nd">这题没有存标准答案，答完请自评。</div>';
    }

    var extra = '';
    if (STATE === 'study'){
      extra = '<div class="res ' + (0?'':'') + '" style="background:#f7f9fd;color:#5b6d86">' +
        (q.ans ? ('标准答案：<b>' + esc(q.ans) + '</b>') : '标准答案：<b>未收录</b>') +
        (q.exp ? ('<div style="margin-top:6px">解析：' + esc(q.exp) + '</div>') : '') + '</div>'
        + '<div style="font-size:11.5px;color:#93a1b4;margin:10px 0 4px">备忘录（跟着这题走，随便写）</div>'
        + '<textarea class="note" id="noteBox">' + esc(D.notes[q.id] || '') + '</textarea>'
        + (p ? ('<div class="meta">当前：' + lvName(p.lv) + (p.due ? ('　下次：' + p.due) : '　已毕业') +
            (p.hist && p.hist.length ? ('<ul class="hist">' + p.hist.slice(-5).map(function(h){
              return '<li>' + h.d + ' ' + (h.ok ? '对' : '错') + '　' + lvName(h.from) + ' → ' + lvName(h.to) + (h.mock ? '（模拟）' : '') + '</li>';
            }).join('') + '</ul>') : '') + '</div>') : '');
    } else {
      extra = '<div class="meta">考试状态：只显示题干和选项，交卷才判。</div>';
    }

    return '<div class="q">'
      + '<span class="tag">' + typeName + ' · 第 ' + (S.cur + 1) + '/' + S.qs.length + ' 题'
      + (S.mock ? ' · 模拟考' : '') + (q.paper ? (' · ' + esc(q.paper)) : '') + '</span>'
      + '<div class="stem">' + esc(q.q) + '</div>'
      + opts
      + res + extra
      + '<div class="nav">'
      + '<button class="btn" id="btnPrev"' + (S.cur === 0 ? ' disabled' : '') + '>← 上一题</button>'
      + (S.cur === S.qs.length - 1
          ? (STATE === 'exam' ? '<button class="btn pri" id="btnSubmit">交卷</button>' : '<button class="btn pri" id="btnEnd">结束本组</button>')
          : '<button class="btn" id="btnNext">下一题 →</button>')
      + '</div></div>';
  }

  function bindQuestion(){
    var q = S.qs[S.cur];
    var box = $('stage');
    Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(b){
      b.onclick = function(){
        if (S.judged[q.id]) return;
        var L = b.dataset.l;
        if (q.type === 'multi'){
          var cur = S.ans[q.id] || '';
          S.ans[q.id] = (cur.indexOf(L) >= 0) ? cur.replace(L,'') : (cur + L).split('').sort().join('');
          render(); return;
        }
        S.ans[q.id] = L;
        if (STATE === 'exam'){ render(); return; }
        doJudge(q);
      };
    });
    var nb = $('noteBox');
    if (nb) nb.onblur = function(){ D.notes[q.id] = nb.value; save(); };
    var bSelf = box.querySelector('[data-self]');
    Array.prototype.forEach.call(box.querySelectorAll('[data-self]'), function(b){
      b.onclick = function(){ selfJudge(q, b.dataset.self === '1'); };
    });
    var bPrev = $('btnPrev'), bNext = $('btnNext'), bSubmit = $('btnSubmit'), bEnd = $('btnEnd');
    if (bPrev) bPrev.onclick = function(){ S.cur--; render(); };
    if (bNext) bNext.onclick = function(){
      if (STATE === 'study' && !S.judged[q.id] && S.ans[q.id]) doJudge(q);
      S.cur++; render();
    };
    if (bSubmit) bSubmit.onclick = submit;
    if (bEnd) bEnd.onclick = submit;
  }

  function doJudge(q){
    var chosen = S.ans[q.id] || '';
    if (!chosen) return;
    var ok = q.ans ? sameSet(chosen, q.ans) : null;
    S.judged[q.id] = { ok: ok };
    if (ok !== null) judgeNow(q, ok, S.mock);
    render();
  }
  function selfJudge(q, ok){
    if (!S.judged[q.id]) S.judged[q.id] = { ok: null };
    S.judged[q.id].ok = ok;
    judgeNow(q, ok, S.mock);
    render();
  }

  /* ---------- 知识点浓度 ---------- */
  function renderKp(){
    var all = items(), map = {};
    all.forEach(function(q){
      var ks = q.kp && q.kp.length ? q.kp : ['未分类'];
      ks.forEach(function(k){ (map[k] = map[k] || []).push(q); });
    });
    var rows = Object.keys(map).map(function(k){ return { k:k, list:map[k] }; })
      .sort(function(a,b){ return b.list.length - a.list.length || a.k.localeCompare(b.k); });
    if (!rows.length) return '<div class="empty">题库为空，先导入题目。</div>';
    var html = '<div class="q" style="padding:12px"><div class="stem" style="font-size:15px"><b>知识点浓度</b></div>'
      + '<div class="meta">以知识点为单位，统计 ' + (FILE_BANK.items.length + D.bank.length) + ' 题里各知识点的出现次数；点开看每一年以什么题出现。按次数从多到少排。</div></div>';
    rows.forEach(function(r, idx){
      var byYear = {};
      r.list.forEach(function(q){ var y = q.year || '未知'; (byYear[y] = byYear[y] || []).push(q); });
      var body = Object.keys(byYear).sort().reverse().map(function(y){
        return '<div class="yy">' + y + ' 年（' + byYear[y].length + ' 题）</div>'
          + byYear[y].sort(function(a,b){ return a.id.localeCompare(b.id); }).map(function(q){
              var tn = { single:'单选', multi:'多选', judge:'判断', essay:'问答' }[q.type] || '';
              return '<div class="qi">' + (q.paper || '') + ' · ' + tn + '第' + q.id.split('_').pop() + '题　' + esc((q.q || '').slice(0, 46)) + '…</div>';
            }).join('');
      }).join('');
      html += '<div class="kp" data-kp="' + idx + '"><div class="hd2"><b>' + esc(r.k) + '</b><span class="cnt">' + r.list.length + ' 题</span></div>'
        + '<div class="body2">' + body + '</div></div>';
    });
    return html;
  }
  function bindKp(){
    Array.prototype.forEach.call($('stage').querySelectorAll('.kp .hd2'), function(h){
      h.onclick = function(){ h.parentNode.classList.toggle('open'); };
    });
  }



  /* ---------- 练过：全部练过的题（对/错分两栏，错的那栏就是错题集） ---------- */
  function ansText(q){
    if (!q.ans) return '未收录';
    if (q.type === 'judge') return q.ans === 'A' ? 'A · 正确' : 'B · 错误';
    return q.ans;
  }
  function countHist(p){
    var w = 0, c = 0, wd = [], cd = [];
    (p.hist || []).forEach(function(h){
      if (h.ok === 1){ c++; cd.push(h.d); }
      else if (h.ok === 0){ w++; wd.push(h.d + (h.mock ? '（模拟）' : '')); }
    });
    return { w:w, c:c, wd:wd, cd:cd };
  }
  function renderDone(){
    var all = items(), list = all.filter(function(q){ return D.prog[q.id]; });
    if (!list.length) return '<div class="q" style="padding:12px"><div class="stem" style="font-size:15px"><b>练过</b></div>'
      + '<div class="meta">还没有练过的题。做过一题就会出现在这里。</div></div>';

    var rightList = [], wrongList = [], gradN = 0, lvA = [0,0,0,0,0];
    list.forEach(function(q){
      var p = D.prog[q.id], h = countHist(p);
      (h.w ? wrongList : rightList).push({ q:q, p:p, h:h });
      if ((p.lv || 0) >= GRAD) gradN++;
      lvA[Math.min(p.lv || 0, GRAD)]++;
    });
    rightList.sort(function(a,b){ return String(b.p.last || '').localeCompare(String(a.p.last || '')); });
    wrongList.sort(function(a,b){ return b.h.w - a.h.w || String(b.h.wd[b.h.wd.length-1] || '').localeCompare(String(a.h.wd[a.h.wd.length-1] || '')); });

    var html = '<div class="q" style="padding:12px"><div class="stem" style="font-size:15px"><b>练过 · 全部存档</b>'
      + '<span class="dv">' + list.length + ' 题</span></div>'
      + '<div class="meta">对 ' + rightList.length + ' 题 · 错 ' + wrongList.length + ' 题 · 毕业 ' + gradN + ' 题　｜　'
      + '现在档位：1 天 ' + lvA[0] + ' · 3 天 ' + lvA[1] + ' · 7 天 ' + lvA[2] + ' · 15 天 ' + lvA[3] + ' · 毕业 ' + lvA[4]
      + '<br>每题的完整题干、选项' + (STATE === 'study' ? '、答案' : '') + '都在卡里，点标题展开看全部对错日期' + (STATE === 'study' ? '，备注直接写、自动保存。' : '。（考试状态不显示答案与备注）') + '</div></div>';

    function card(r, idx, isWrong){
      var q = r.q, p = r.p, h = r.h;
      var tn = { single:'单选', multi:'多选', judge:'判断', essay:'问答' }[q.type] || '';
      var grad = (p.lv || 0) >= GRAD;
      var head = '<b>' + (q.paper || '') + ' · ' + tn + '第' + q.id.split('_').pop() + '题</b>'
        + '<span class="dv' + (grad ? ' g' : '') + '">' + lvName(p.lv || 0) + '</span>'
        + (isWrong ? '<span class="wbad">错 ' + h.w + '</span><span class="wok">对 ' + h.c + '</span>' : '')
        + '<span class="cnt">' + (grad ? '已毕业' : (p.due ? '下次 ' + p.due : '')) + '</span>';
      var opts = (q.opts || []).map(function(o){ return '<div class="oo">' + esc(o) + '</div>'; }).join('');
      var body = '<div class="wq">' + esc(q.q || '') + '</div>' + opts;
      if (STATE === 'study'){
        body += '<div class="ansline">标准答案：<b>' + esc(ansText(q)) + '</b></div>';
        if (q.exp) body += '<div class="expl">解析：' + esc(q.exp) + '</div>';
      }
      body += '<div class="wline"><span class="wt bad">错</span>' + (h.wd.length ? h.wd.map(function(d){ return '<span class="wd">' + esc(String(d)) + '</span>'; }).join('') : '<span class="wd">没有</span>') + '</div>'
        + '<div class="wline"><span class="wt ok">对</span>' + (h.cd.length ? h.cd.map(function(d){ return '<span class="wd">' + esc(d) + '</span>'; }).join('') : '<span class="wd">没有</span>') + '</div>';
      if (STATE === 'study'){
        body += '<div style="font-size:11.5px;color:#93a1b4;margin-top:8px">备注<span class="svd" id="svd_' + q.id + '"></span></div>'
          + '<textarea class="note2" data-q="' + q.id + '" placeholder="随便写，输入即保存">' + esc(D.notes[q.id] || '') + '</textarea>';
      }
      return '<div class="kp" data-x="' + idx + '"><div class="hd2">' + head + '</div><div class="body2">' + body + '</div></div>';
    }

    html += '<div class="two"><div class="col"><div class="colh ok">✓ 对的（' + rightList.length + ' 题）</div>'
      + (rightList.length ? rightList.map(function(r, i){ return card(r, i, false); }).join('') : '<div class="meta" style="padding:8px 0">还没有全对的题。</div>')
      + '</div><div class="col"><div class="colh bad">✗ 错的 · 错题集（' + wrongList.length + ' 题）</div>'
      + '<div class="meta" style="margin:2px 0 6px">错得最多的排最前；展开可见每次错、每次对的日期与当前档位。</div>'
      + (wrongList.length ? wrongList.map(function(r, i){ return card(r, i, true); }).join('') : '<div class="meta" style="padding:8px 0">还没有错过的题，保持住。</div>')
      + '</div></div>';
    return html;
  }

  function bindNotes(){
    Array.prototype.forEach.call($('stage').querySelectorAll('.note2'), function(el){
      var id = el.getAttribute('data-q');
      el.oninput = function(){
        D.notes[id] = el.value;
        clearTimeout(el._t);
        el._t = setTimeout(function(){ save(); }, 300);
        var tip = document.getElementById('svd_' + id);
        if (tip){ tip.textContent = '已保存'; setTimeout(function(){ if (tip) tip.textContent = ''; }, 1200); }
      };
    });
  }

  /* ---------- 导出 / 导入记录 ---------- */
  function exportAll(){
    var out = { app:'console-hub/exam', kind:'认通基刷题记录', exportedAt:HUB.nowStamp(), total:items().length, records:[] };
    items().forEach(function(q){
      var p = D.prog[q.id] || null;
      out.records.push({
        id:q.id, paper:q.paper, year:q.year, type:q.type, q:q.q, opts:q.opts, ans:q.ans, kp:q.kp,
        note: D.notes[q.id] || '',
        lv: p ? p.lv : null, due: p ? p.due : null, last: p ? p.last : null,
        hist: p ? p.hist : []
      });
    });
    var txt = JSON.stringify(out, null, 1);
    var blob = new Blob([txt], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '认通基刷题记录-' + HUB.todayStr() + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    HUB.toast('已导出 ' + out.records.length + ' 题记录');
  }

  function importRecords(j){
    var recs = j.records || j.items || [];
    var n = 0, notes = 0;
    recs.forEach(function(r){
      if (!r || !r.id) return;
      if (r.note){ D.notes[r.id] = r.note; notes++; }
      if (r.lv != null){
        var p = D.prog[r.id];
        var hist = r.hist || [];
        if (!p){ D.prog[r.id] = { lv:r.lv, due:r.due || '', last:r.last || '', hist:hist }; n++; }
        else {
          var seen = {};
          p.hist.forEach(function(h){ seen[h.d + '|' + h.ok] = 1; });
          hist.forEach(function(h){ if (!seen[h.d + '|' + h.ok]) p.hist.push(h); });
          if ((Number(r.last) || 0) >= 0 && String(r.last || '') >= String(p.last || '')){ p.lv = r.lv; p.due = r.due || p.due; p.last = r.last || p.last; }
        }
      }
    });
    save(); stats();
    alert('导入完成：档位 ' + n + ' 题，笔记 ' + notes + ' 条。');
  }

  /* ---------- 交卷 ---------- */
  function submit(){
    var answered = 0, right = 0, unknown = 0, wrong = [];
    S.qs.forEach(function(q){
      var j = S.judged[q.id];
      if (!j){
        if (S.ans[q.id]){                     // 考试状态里选了但没判的
          var ok = q.ans ? sameSet(S.ans[q.id], q.ans) : null;
          j = { ok: ok }; S.judged[q.id] = j;
          if (ok !== null) judgeNow(q, ok, S.mock);
        }
      }
      if (!j) return;
      if (j.ok === null){ unknown++; return; }
      answered++;
      if (j.ok) right++; else wrong.push(q.id);
    });
    S.result = { total:S.qs.length, answered:answered, right:right, wrong:wrong, unknown:unknown };
    render();
  }

  function renderResult(){
    var r = S.result;
    var wrongList = r.wrong.map(function(id){
      var q = byId(id), p = D.prog[id];
      var myAns = S.ans[id] || '';
      var opts = (q.opts || []).map(function(o){
        var L = (o.match(/^([A-D])/) || [])[1] || '';
        var isOk = q.ans && q.ans.indexOf(L) >= 0;
        var isMine = L && myAns.indexOf(L) >= 0;
        return '<div class="ro' + (isOk ? ' ok' : '') + (isMine ? ' mine' : '') + '">' + esc(o)
          + (isOk ? ' ✓' : '') + (isMine && !isOk ? ' ← 你选的' : '') + '</div>';
      }).join('');
      return '<div class="q"><span class="tag">' + esc(q.paper || '') + '</span><div class="stem">' + esc(q.q) + '</div>' +
        opts +
        '<div class="res bad">正确答案：' + esc(q.ans || '（缺）') + (myAns ? ('　你选：' + esc(myAns)) : '') + '</div>' +
        (p ? '<div class="meta">当前：' + lvName(p.lv) + (p.due ? ('　下次：' + p.due) : '') + '</div>' : '') + '</div>';
    }).join('');
    return '<div class="q"><div class="stem" style="font-size:16px"><b>本组结束</b></div>'
      + '<div class="meta">共 ' + r.total + ' 题 · 已判 ' + r.answered + ' 题 · 答对 ' + r.right
      + (r.unknown ? ('　缺答案待自评 ' + r.unknown + ' 题') : '') + '</div></div>'
      + (r.wrong.length ? ('<div style="font-size:12px;color:#93a1b4;margin:16px 0 4px">错题（已回 1 天档，明天到期）</div>' + wrongList) : '')
      + '<div class="nav" style="margin-top:16px"><button class="btn pri" id="btnAgain">再来一组</button>'
      + '<button class="btn" id="btnIdle">回到首页</button></div>';
  }
  function bindResult(){
    $('btnAgain').onclick = function(){ var mock = S.mock; S = {mode:'idle',qs:[],cur:0,ans:{},judged:{}}; startSession(mock); };
    $('btnIdle').onclick = function(){ S = { mode:'idle', qs:[], cur:0, ans:{}, judged:{} }; $('stage').innerHTML = '<div class="empty">点「开始一组」开练。</div>'; };
  }

  /* ---------- 导入题库 ---------- */
  function mergeBank(arr){
    var n = 0;
    arr.forEach(function(q){
      if (!q || !q.id || !q.q) return;
      if (!q.opts) q.opts = [];
      D.bank.push(q); n++;
    });
    save(); stats();
    alert('导入 ' + n + ' 题，题库现共 ' + items().length + ' 题。');
  }
  $('btnImport').onclick = function(){ $('fileBank').click(); };
  $('fileBank').onchange = function(){
    var f = this.files && this.files[0]; if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      try {
        var j = JSON.parse(String(fr.result));
        var arr = Array.isArray(j) ? j : (j.items || j.questions || []);
        if (!arr.length) throw new Error('没找到题目数组');
        mergeBank(arr);
      } catch(e){ alert('导入失败：' + e.message); }
      $('fileBank').value = '';
    };
    fr.readAsText(f, 'utf-8');
  };

  /* ---------- 启动 ---------- */
  $('btnExport').onclick = exportAll;
  $('btnKp').onclick = function(){
    S = { mode:'kp', qs:[], cur:0, ans:{}, judged:{} };
    render();
  };
  $('bDone').onclick = function(){
    S = { mode:'done', qs:[], cur:0, ans:{}, judged:{} };
    render();
  };
  var fileRec = document.createElement('input');
  fileRec.type = 'file'; fileRec.accept = '.json,application/json'; fileRec.style.display = 'none';
  document.body.appendChild(fileRec);
  $('btnImportRec').onclick = function(){ fileRec.click(); };
  fileRec.onchange = function(){
    var f = fileRec.files && fileRec.files[0]; if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      try { importRecords(JSON.parse(String(fr.result))); }
      catch(e){ alert('导入失败：' + e.message); }
      fileRec.value = '';
    };
    fr.readAsText(f, 'utf-8');
  };

  $('btnStart').onclick = function(){ startSession(false); };
  $('btnMock').onclick = function(){ startSession(true); };

  migrate();
  setState('exam');
  stats();

  fetch('exam/bank.json?r=' + Date.now())
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ if (j) { FILE_BANK.items = (j.items || j.questions || []); stats(); } })
    .catch(function(){});
})();
</script>
</body>
</html>
