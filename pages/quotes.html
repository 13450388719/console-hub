<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>弱智吧</title>
<link rel="stylesheet" href="../shared/hub.css?v=20261116h">
</head>
<body>
<div class="wrap">
  <div class="backbar"><a class="back" href="../个人中控台.html">← 返回中控台</a><a class="back plus" href="memo.html">🔔 备忘</a></div>
  <div class="hd">
    <h1>🤪 弱智吧</h1>
    <div class="sub">杂记金句库 · 按章节标签筛选 · 置顶优先 · 🎲 随手一句</div>
  </div>
  <div class="syncbar">
    <div class="sync" data-sync-badge><span class="dot"></span>检测中…</div>
    <button class="btn-mini" id="btnSync">同步设置</button>
    <button class="btn-mini" id="btnAlign">记得手动同步</button>
  </div>

  <div class="stat">
    <div class="cell"><div class="k">全部句子</div><div class="v" id="sAll">0</div></div>
    <div class="cell"><div class="k">置顶</div><div class="v" id="sPin">0</div></div>
    <div class="cell"><div class="k">章节</div><div class="v" id="sTag">0</div></div>
  </div>

  <div class="panel">
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜索句子 / 备注 / 标签…" style="flex:1;min-width:180px">
      <button class="btn" id="btnRandom">🎲 随手一句</button>
      <button class="btn ghost" id="btnNew">＋ 新增</button>
      <select id="sortKey" style="max-width:150px">
        <option value="created">按创建时间</option>
        <option value="text">按文字排序</option>
      </select>
      <button class="btn gray sm" id="btnDir">正序 ↑</button>
    </div>
    <div id="tags" style="margin-top:12px"></div>
  </div>

  <div class="panel">
    <div class="panel-title"><span>📚 句子库</span><span class="grow"></span><span class="hint" style="margin:0" id="cnt"></span></div>
    <div id="list"></div>
  </div>

  <div class="footer-f">新增与编辑同一套字段：出处 / 正文 / 感悟 / 标签 · 新加的排在最上面（置顶始终优先）<br>与乐享「弱智吧」表格双向同步：保存后内容真有变化会自动登记同步；表格里手工删掉一行 = 这里一并删掉；这里新加的会补到表尾</div>
</div>

<script src="../data/seed.js?v=20261116h"></script>
<script src="../shared/hub.js?v=20261126a"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var curTag = '', curQ = '';
  function items(){ return HUB.get('quotes', {items:[],sort:{key:'created',dir:'desc'}}) || {items:[],sort:{key:'created',dir:'desc'}}; }
  function save(o){ HUB.set('quotes', o); }
  function tagOf(q){
    if (q.tag) return q.tag;
    var n = q.note || '';
    var seg = n.split('·').pop().trim();
    return seg || '未分类';
  }
  function sortItems(list, key, dir){
    var d = (dir === 'desc') ? -1 : 1;
    return list.slice().sort(function(a,b){
      if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      var va, vb;
      if (key === 'text'){ va = a.text || ''; vb = b.text || '';
        var c = va.localeCompare(vb, 'zh-CN'); return c * d; }
      va = a.createdAt || ''; vb = b.createdAt || '';
      if (va === vb) return 0;
      return (va < vb ? -1 : 1) * d;
    });
  }

  function render(){
    var o = items(), list = o.items || [];
    var keys = {};
    list.forEach(function(q){ keys[tagOf(q)] = (keys[tagOf(q)]||0) + 1; });
    var tagNames = Object.keys(keys).sort(function(a,b){ return a.localeCompare(b,'zh-CN'); });
    $('sAll').textContent = list.length;
    $('sPin').textContent = list.filter(function(q){ return q.pinned; }).length;
    $('sTag').textContent = tagNames.length;

    $('tags').innerHTML = '<span class="tag' + (curTag===''?' pin':'') + '" data-tag="" style="cursor:pointer">全部 ' + list.length + '</span>'
      + tagNames.map(function(t){
        return '<span class="tag' + (curTag===t?' pin':'') + '" data-tag="' + HUB.esc(t) + '" style="cursor:pointer">' + HUB.esc(t) + ' ' + keys[t] + '</span>';
      }).join('');
    Array.prototype.forEach.call($('tags').querySelectorAll('[data-tag]'), function(el){
      el.onclick = function(){ curTag = el.dataset.tag; render(); };
    });

    var shown = sortItems(list, $('sortKey').value, $('btnDir').dataset.dir || 'asc')
      .filter(function(q){
        if (curTag && tagOf(q) !== curTag) return false;
        if (!curQ) return true;
        return ((q.text||'') + ' ' + (q.note||'') + ' ' + tagOf(q)).toLowerCase().indexOf(curQ) >= 0;
      });
    $('cnt').textContent = '显示 ' + shown.length + ' / ' + list.length + ' 条';

    if (!shown.length){ $('list').innerHTML = '<div class="empty">这一格还没有句子</div>'; return; }
    $('list').innerHTML = shown.map(function(q){
      var t = tagOf(q);
      return '<div class="scard' + (q.pinned?' pinned':'') + '" style="margin-top:10px">'
        + '<div class="row1"><div class="nm">' + (q.pinned?'📌 ':'') + (q.source ? HUB.esc(q.source) : '随手记') + '</div>'
        + '<div class="x"><a data-pin="' + q.id + '">' + (q.pinned?'取消置顶':'置顶') + '</a>'
        + '<a data-edit="' + q.id + '">编辑</a><a class="del" data-del="' + q.id + '">删除</a></div></div>'
        + '<div class="body">' + HUB.esc(q.text) + '</div>'
        + (q.note ? '<div class="src">' + HUB.esc(q.note) + '</div>' : '')
        + '<div style="margin-top:8px"><span class="tag">' + HUB.esc(t) + '</span>'
        + (q.createdAt ? '<span class="tag">' + HUB.esc(q.createdAt) + '</span>' : '') + '</div>'
        + '</div>';
    }).join('');

    Array.prototype.forEach.call($('list').querySelectorAll('[data-pin]'), function(el){
      el.onclick = function(){
        var o2 = items(); o2.items.forEach(function(x){ if (x.id === el.dataset.pin) x.pinned = !x.pinned; });
        save(o2); render();
      };
    });
    Array.prototype.forEach.call($('list').querySelectorAll('[data-del]'), function(el){
      el.onclick = function(){
        if (!confirm('删除这一句？')) return;
        var o2 = items(); o2.items = o2.items.filter(function(x){ return x.id !== el.dataset.del; });
        save(o2); render(); HUB.toast('已删除');
      };
    });
    Array.prototype.forEach.call($('list').querySelectorAll('[data-edit]'), function(el){
      el.onclick = function(){ openEditor(el.dataset.edit); };
    });
  }

  function allTags(){
    var set = {};
    (items().items || []).forEach(function(q){ set[tagOf(q)] = 1; });
    return Object.keys(set).sort(function(a,b){ return a.localeCompare(b,'zh-CN'); });
  }

  /* 新增 / 编辑共用一套表单：出处、正文、感悟、标签、置顶 */
  function openEditor(id){
    var o = items(), list = o.items || [];
    var target = id ? list.filter(function(x){ return x.id === id; })[0] : null;
    if (id && !target) return;
    var isNew = !target;
    var it = target || { text:'', source:'', note:'', tag:'', pinned:false, createdAt:'' };
    var tags = allTags();
    var m = document.createElement('div'); m.className = 'mask';
    m.innerHTML = '<div class="dlg" style="max-width:680px"><h3>' + (isNew ? '新增一句' : '编辑 · ' + HUB.esc(it.source || '随手记')) + '</h3>'
      + '<p class="dlg-sub">出处填书名/节目/人名，正文填原句，感悟填你自己的话，标签决定它归到哪个分类</p>'
      + '<div class="form-grid one">'
      + '<div><label class="f">出处（可空）</label><input type="text" id="qSrc" value="' + HUB.esc(it.source||'') + '" placeholder="经营未来_(李明博)"></div>'
      + '<div><label class="f">正文（必填）</label><textarea id="qTxt" rows="3" placeholder="大学中途退学的话一定比高中毕业证还强些吧。">' + HUB.esc(it.text||'') + '</textarea></div>'
      + '<div><label class="f">感悟（可空）</label><textarea id="qNote" rows="3" placeholder="宁为凤尾不做鸡头；不求成功，只想看看最强版本的自己">' + HUB.esc(it.note||'') + '</textarea></div>'
      + '<div><label class="f">标签 / 分类</label><input type="text" id="qTag" list="qTagList" value="' + HUB.esc(it.tag || tagOf(it)) + '" placeholder="自我期许：成为更强的自己">'
      + '<datalist id="qTagList">' + tags.map(function(t){ return '<option value="' + HUB.esc(t) + '">'; }).join('') + '</datalist>'
      + '<div class="hint" style="margin-top:6px">输入已有标签会直接归入该分类；写新名称就是新建分类</div></div>'
      + '<div><label class="checkline" style="font-size:13px"><input type="checkbox" id="qPin"' + (it.pinned?' checked':'') + '> 置顶（置顶的永远排最前）</label></div>'
      + '</div><div class="dlg-foot"><button class="btn gray" id="qCancel">取消</button><button class="btn" id="qSave">' + (isNew?'加入句子库':'保存修改') + '</button></div></div>';
    document.body.appendChild(m);
    m.querySelector('#qCancel').onclick = function(){ m.remove(); };
    m.addEventListener('click', function(e){ if (e.target === m) m.remove(); });
    m.querySelector('#qSave').onclick = function(){
      var txt = m.querySelector('#qTxt').value.trim();
      if (!txt){ HUB.toast('正文不能为空'); return; }
      var payload = {
        source: m.querySelector('#qSrc').value.trim(),
        text: txt,
        note: m.querySelector('#qNote').value.trim(),
        tag: m.querySelector('#qTag').value.trim(),
        pinned: m.querySelector('#qPin').checked
      };
      var o2 = items();
      if (isNew){
        o2.items.unshift({
          id: 'q_' + Date.now().toString(36), source: payload.source, text: payload.text,
          note: payload.note, tag: payload.tag, pinned: payload.pinned,
          createdAt: HUB.nowStamp(), updatedAt: ''
        });
        if (o2.sort) o2.sort.key = 'created';
      } else {
        var t2 = o2.items.filter(function(x){ return x.id === id; })[0];
        if (!t2) return;
        t2.source = payload.source; t2.text = payload.text; t2.note = payload.note;
        t2.tag = payload.tag; t2.pinned = payload.pinned; t2.updatedAt = HUB.nowStamp();
      }
      save(o2); m.remove(); render();
      HUB.toast(isNew ? (HUB.cloudOn() ? '已加入句子库，记得手动同步' : '已加入句子库（排在最上面）')
                      : (HUB.cloudOn() ? '已保存，记得手动同步' : '已保存'));
    };
  }

  /* 🎲 随手一句：全库一个大洗牌袋，抽完一轮才重置；同一句、同一标签都不会连出 */
  var gBag = null, gBagSig = '', lastTag = null, lastText = null;
  function rndInt(n){
    if (n <= 0) return 0;
    try { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
    catch(e){ return Math.floor(Math.random()*n); }
  }
  function listSig(list){
    var n = list.length, c = 0;
    for (var i=0;i<n;i++) c += (list[i].id || '').length + (list[i].text || '').length;
    return n + '|' + (list[0] && list[0].id) + '|' + (list[n-1] && list[n-1].id) + '|' + c;
  }
  function buildBag(list){
    // 同一句话只留一条（防止重复录入导致反复出现）
    var seen = {}, uniq = [];
    list.forEach(function(it){
      var t = (it.text || '').trim();
      if (t && seen[t]) return;
      if (t) seen[t] = 1;
      uniq.push(it.id);
    });
    for (var i=uniq.length-1;i>0;i--){ var j=rndInt(i+1); var t2=uniq[i]; uniq[i]=uniq[j]; uniq[j]=t2; }
    return uniq;
  }
  function pickOne(){
    var list = (items().items) || [];
    if (!list.length) return null;
    var byId = {};
    list.forEach(function(it){ byId[it.id] = it; });

    var sig = listSig(list);
    if (!gBag || !gBag.length || gBagSig !== sig){ gBag = buildBag(list); gBagSig = sig; }

    var idx = -1;
    for (var i=gBag.length-1;i>=0;i--){
      var it = byId[gBag[i]];
      if (!it) continue;
      var tag = it.tag || '未分类';
      var bad = (lastTag && tag === lastTag) || (lastText && (it.text || '') === lastText);
      if (bad && gBag.length > 1) continue;
      idx = i; break;
    }
    if (idx < 0) idx = gBag.length - 1;

    var id = gBag.splice(idx, 1)[0];
    var q = byId[id];
    if (!q){ gBag = null; return pickOne(); }
    lastTag = q.tag || '未分类';
    lastText = q.text || '';
    q.__tag = lastTag;
    return q;
  }

  $('btnRandom').onclick = function(){
    var q = pickOne();
    if (!q){ HUB.toast('库里还没有句子'); return; }
    var m = document.createElement('div');
    m.className = 'mask';
    m.innerHTML = '<div class="dlg" style="max-width:520px"><h3>🎲 随手一句</h3>'
      + '<div style="font-size:16px;line-height:1.95;margin:14px 0;white-space:pre-wrap">' + HUB.esc(q.text) + '</div>'
      + (q.note?'<div class="hint">'+HUB.esc(q.note)+'</div>':'')
      + (q.source?'<div class="hint">—— '+HUB.esc(q.source)+'</div>':'')
      + '<div class="dlg-foot"><button class="btn gray" id="rm">关掉</button>'
      + '<button class="btn" id="rp">再抽一句</button></div></div>';
    document.body.appendChild(m);
    m.querySelector('#rm').onclick = function(){ m.remove(); };
    m.querySelector('#rp').onclick = function(){ m.remove(); $('btnRandom').click(); };
    m.addEventListener('click', function(e){ if (e.target === m) m.remove(); });
  };

  $('btnNew').onclick = function(){ openEditor(''); };

  $('q').oninput = function(){ curQ = this.value.trim().toLowerCase(); render(); };
  $('sortKey').onchange = function(){
    var o = items(); o.sort = { key:this.value, dir:$('btnDir').dataset.dir||'desc', migrated:true }; save(o); render();
  };
  /* 新加的排最上面：默认按时间倒序（老数据一次性迁过来） */
  (function(){
    var o = items();
    if (!o.sort || !o.sort.migrated){
      o.sort = { key: (o.sort && o.sort.key) || 'created', dir: 'desc', migrated: true };
      save(o);
    }
    var dir = (o.sort && o.sort.dir) || 'desc';
    $('btnDir').dataset.dir = dir;
    $('btnDir').textContent = dir === 'desc' ? '倒序 ↓' : '正序 ↑';
    $('sortKey').value = (o.sort && o.sort.key) || 'created';
  })();
  $('btnDir').onclick = function(){
    this.dataset.dir = this.dataset.dir === 'desc' ? 'asc' : 'desc';
    this.textContent = this.dataset.dir === 'desc' ? '倒序 ↓' : '正序 ↑';
    var o = items(); o.sort = { key:$('sortKey').value, dir:this.dataset.dir }; save(o); render();
  };
  $('btnSync').onclick = HUB.openSyncDialog;

  /* 手动同步提醒：落表要在对话里叫助手 */
  $('btnAlign').onclick = function(){
    HUB.toast('记得手动同步：在对话里跟助手说「同步」，我当场对齐乐享表格');
  };
  HUB.onRemote(function(){ render(); });
  render();
})();
</script>
</body>
</html>
