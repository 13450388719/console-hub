<script>
/* Leaflet 多源加载：一个源挂了自动换下一个 */
window.__loadLeaflet = (function(){
  var CDN = [
    'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
    'https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.js',
    'https://cdn.staticfile.org/leaflet/1.9.4/leaflet.js'
  ];
  var CSS = [
    'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css',
    'https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.css',
    'https://cdn.staticfile.org/leaflet/1.9.4/leaflet.css'
  ];
  var done = false, started = false, waiting = [];
  function css(i){
    if (i >= CSS.length || document.querySelector('link[data-lf]')) return;
    var l = document.createElement('link'); l.rel='stylesheet'; l.href=CSS[i]; l.setAttribute('data-lf','1');
    l.onerror = function(){ l.remove(); css(i+1); };
    document.head.appendChild(l);
  }
  function finish(ok){
    done = true;
    waiting.forEach(function(cb){ cb(ok); });
    waiting = [];
  }
  function tryLoad(i){
    if (window.L) { css(0); finish(true); return; }
    if (i >= CDN.length) { finish(false); return; }
    var s = document.createElement('script');
    s.src = CDN[i]; s.async = true;
    var settled = false;
    var t = setTimeout(function(){ if (!settled){ settled = true; s.remove(); tryLoad(i+1); } }, 9000);
    s.onload = function(){ if (!settled){ settled=true; clearTimeout(t); css(0); finish(!!window.L); } };
    s.onerror = function(){ if (!settled){ settled=true; clearTimeout(t); tryLoad(i+1); } };
    document.head.appendChild(s);
  }
  return function(cb){
    if (window.L) { if (cb) cb(true); return; }
    if (done) { if (cb) cb(!!window.L); return; }
    if (cb) waiting.push(cb);
    if (!started){ started = true; tryLoad(0); }
  };
})();
</script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var MODE = 'text';
  var Q = '';
  var MAP = null, LAYER = null, ME = null, ME_MARK = null, MARKERS = [];

  function store(){ return HUB.get('foods', {items:[],sort:{key:'created',dir:'desc'},home:null}); }
  function items(){ var s = store(); return s.items || []; }
  function save(o){ HUB.set('foods', o); }

  /* ---------- 距离 ---------- */
  function rad(d){ return d*Math.PI/180; }
  function dist(a, b){
    if (!a || !b) return null;
    var R = 6371000;
    var dLat = rad(b.lat-a.lat), dLng = rad(b.lng-a.lng);
    var h = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)*Math.sin(dLng/2);
    return 2*R*Math.asin(Math.sqrt(h));
  }
  function fmtDist(m){
    if (m === null || m === undefined) return '';
    if (m < 1000) return Math.round(m) + ' 米';
    if (m < 10000) return (m/1000).toFixed(1) + ' 公里';
    return Math.round(m/1000) + ' 公里';
  }
  /* WGS84 → GCJ-02（高德瓦片用 GCJ 坐标） */
  function wgs2gcj(lat, lng){
    var a = 6378245.0, ee = 0.00669342162296594323;
    function tlat(x, y){
      var r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
      r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI))*2/3;
      r += (20*Math.sin(y*Math.PI) + 40*Math.sin(y/3*Math.PI))*2/3;
      r += (160*Math.sin(y/12*Math.PI) + 320*Math.sin(y*Math.PI/30))*2/3;
      return r;
    }
    function tlng(x, y){
      var r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
      r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI))*2/3;
      r += (20*Math.sin(x*Math.PI) + 40*Math.sin(x/3*Math.PI))*2/3;
      r += (150*Math.sin(x/12*Math.PI) + 300*Math.sin(x/30*Math.PI))*2/3;
      return r;
    }
    var dLat = tlat(lng-105, lat-35), dLng = tlng(lng-105, lat-35);
    var m = Math.sin(rad(lat)); m = 1 - ee*m*m;
    var sq = Math.sqrt(m);
    dLat = (dLat*180)/((a*(1-ee))/(m*sq)*Math.PI);
    dLng = (dLng*180)/(a/sq*Math.cos(rad(lat))*Math.PI);
    return { lat: lat + dLat, lng: lng + dLng };
  }

  /* ---------- 渲染 ---------- */
  function stat(){
    var it = items();
    $('sAll').textContent = it.length;
    $('sImg').textContent = it.filter(function(x){ return !!x.img; }).length;
    $('sGeo').textContent = it.filter(function(x){ return x.lat && x.lng; }).length;
    var last = it.slice().sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); })[0];
    $('sLast').textContent = last ? (last.createdAt || '').slice(0,10) : '—';
  }

  function matched(){
    var home = store().home;
    var kw = Q.toLowerCase();
    var list = items().filter(function(x){
      if (!kw) return true;
      return [x.title, x.what, x.from, x.addr, x.tag, x.note].join(' ').toLowerCase().indexOf(kw) >= 0;
    });
    list.sort(function(a,b){
      if (home && a.lat && b.lat) return (dist(home,a)||0) - (dist(home,b)||0);
      return (b.createdAt||'').localeCompare(a.createdAt||'');
    });
    return list;
  }

  function card(x){
    var home = store().home;
    var d = (home && x.lat) ? dist(home, x) : null;
    var tagHtml = '<span class="chip src">' + HUB.esc(x.kind || '自己吃') + (x.from ? ' · ' + HUB.esc(x.from) : '') + '</span>';
    if (x.price) tagHtml += '<span class="chip">' + HUB.esc(x.price) + '</span>';
    if (x.createdAt) tagHtml += '<span class="chip">' + HUB.esc(x.createdAt.slice(0,10)) + '</span>';
    if (x.tag) tagHtml += '<span class="chip">' + HUB.esc(x.tag) + '</span>';
    var thumb = x.img ? '<img class="thumb" src="' + HUB.esc(x.img) + '" loading="lazy">' : '';
    var nav = (x.lat && x.lng) ? 'https://uri.amap.com/marker?position=' + x.lng + ',' + x.lat + '&name=' + encodeURIComponent(x.title||'美食') : '';
    return '<div class="fcard" data-id="' + HUB.esc(x.id) + '">'
      + '<div class="t1">' + HUB.esc(x.title || '未命名')
      + (d !== null ? '<span class="dist">距我 ' + fmtDist(d) + '</span>' : '') + '</div>'
      + '<div class="row">' + thumb + '<div style="flex:1;min-width:0">'
      + (x.what ? '<div class="what">' + HUB.esc(x.what) + '</div>' : '')
      + '<div class="from">出处：' + HUB.esc(x.kind || '自己吃') + (x.from ? '（' + HUB.esc(x.from) + '）' : '') + '</div>'
      + (x.addr ? '<div class="addr">📍 ' + HUB.esc(x.addr) + (nav ? ' · <a href="' + nav + '" target="_blank" rel="noopener">导航</a>' : '') + '</div>' : '')
      + (x.note ? '<div class="mini">' + HUB.esc(x.note) + '</div>' : '')
      + '</div></div>'
      + '<div class="tags">' + tagHtml + '</div>'
      + '<div style="margin-top:8px;display:flex;gap:10px;font-size:12px">'
      + '<a href="javascript:;" class="ed" style="color:#1a6ee0">编辑</a>'
      + (!x.lat || !x.lng ? '<a href="javascript:;" class="pin" style="color:#0b7a4b">📍 补坐标</a>' : '<a href="javascript:;" class="nav2" style="color:#7c8ca3">地图上看看</a>')
      + '<a href="javascript:;" class="del" style="color:#c23c3c">删除</a>'
      + (x.img ? '<a href="javascript:;" class="big" style="color:#7c8ca3">看大图</a>' : '')
      + '</div></div>';
  }

  function renderList(){
    var list = matched();
    $('list').innerHTML = list.length ? list.map(card).join('') : '<div class="empty">还没有记录。点右上「＋ 记一家」，把店名、好食咩、出处、地址填进去。</div>';
  }

  function renderNear(){
    var home = store().home;
    var withGeo = items().filter(function(x){ return x.lat && x.lng; });
    if (!withGeo.length){ $('nearbox').innerHTML = '<div class="mini">还没有带坐标的记录：在记录卡上点「📍 补坐标」，或录入时在地图上点一下。</div>'; return; }
    if (!home){
      $('nearbox').innerHTML = '<div class="mini">点「📍 以我为中心」定位后，这里按距离最近排序。</div>'
        + withGeo.slice().sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); }).map(function(x){
            return '<div class="nearrow" data-id="' + HUB.esc(x.id) + '"><div><div class="nm">' + HUB.esc(x.title||'未命名') + '</div>'
              + '<div class="ad">' + HUB.esc(x.addr || '') + '</div></div><div class="d">—</div></div>';
          }).join('');
      return;
    }
    var arr = withGeo.map(function(x){ return {x:x, d:dist(home,x)}; }).sort(function(a,b){ return a.d-b.d; });
    var groups = [[0,3000,'3 公里内'],[3000,10000,'3–10 公里'],[10000,1e9,'10 公里外']];
    var html = '';
    groups.forEach(function(g){
      var sub = arr.filter(function(e){ return e.d >= g[0] && e.d < g[1]; });
      if (!sub.length) return;
      html += '<div class="grp">' + g[2] + '（' + sub.length + '）</div>';
      sub.forEach(function(e){
        html += '<div class="nearrow" data-id="' + HUB.esc(e.x.id) + '"><div><div class="nm">' + HUB.esc(e.x.title||'未命名') + '</div>'
          + '<div class="ad">' + HUB.esc(e.x.addr || (e.x.lat.toFixed(5) + ', ' + e.x.lng.toFixed(5))) + '</div></div>'
          + '<div class="d">' + fmtDist(e.d) + '</div></div>';
      });
    });
    $('nearbox').innerHTML = html;
  }

  /* ---------- 地图 ---------- */
  function ensureMap(){
    if (MAP) return MAP;
    MAP = L.map('map', { zoomControl:true }).setView([23.129, 113.264], 12);
    LAYER = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
      subdomains:['1','2','3','4'], maxZoom:19, attribution:'© 高德'
    }).addTo(MAP);
    return MAP;
  }

  function renderMap(){
    if (typeof L === 'undefined'){
      window.__loadLeaflet(function(ok){
        if (ok){ MAP = null; renderMap(); }
        else { $('map').innerHTML = '<div class="empty">地图库没加载出来（网络被挡），切回文字模式仍可正常使用。</div>'; }
      });
      return;
    }
    var m = ensureMap();
    var allN = items().length, geoN = items().filter(function(x){ return x.lat && x.lng; }).length;
    if ($('geoStat')) $('geoStat').textContent = '已标记 ' + geoN + ' / ' + allN + ' 家' + (allN - geoN > 0 ? '（' + (allN - geoN) + ' 家缺坐标，点卡片上的「补坐标」）' : '');
    MARKERS.forEach(function(mk){ m.removeLayer(mk); });
    MARKERS = [];
    var pts = items().filter(function(x){ return x.lat && x.lng; });
    pts.forEach(function(x){
      var mk = L.marker([x.lat, x.lng], { icon: L.divIcon({ className:'', html:'<div class="mk"></div>', iconSize:[16,16], iconAnchor:[8,8] }) }).addTo(m);
      mk.bindPopup('<div style="font-size:13px;line-height:1.6"><b>' + HUB.esc(x.title||'未命名') + '</b><br>' + HUB.esc(x.what||'') + '<br>' + HUB.esc(x.addr||'') + '<br><span style="color:#178a53">' + HUB.esc(x.kind||'') + (x.from?' · '+HUB.esc(x.from):'') + '</span></div>');
      mk.on('click', function(){ mk.openPopup(); });
      MARKERS.push(mk);
    });
    var home = store().home;
    if (home && home.lat){
      ME = home;
      if (ME_MARK) m.removeLayer(ME_MARK);
      ME_MARK = L.marker([home.lat, home.lng], { icon: L.divIcon({ className:'', html:'<div class="mk me"></div>', iconSize:[16,16], iconAnchor:[8,8] }) }).addTo(m).bindPopup('我在这儿');
      m.setView([home.lat, home.lng], 14);
    } else if (pts.length === 1){
      m.setView([pts[0].lat, pts[0].lng], 16);
    } else if (pts.length > 1){
      m.fitBounds(pts.map(function(x){ return [x.lat, x.lng]; }), { padding:[40,40] });
    }
    setTimeout(function(){ m.invalidateSize(); }, 60);
    renderNear();
  }

  function locate(){
    if (!navigator.geolocation){ HUB.toast('这个浏览器不支持定位'); return; }
    $('locTip').textContent = '定位中…';
    navigator.geolocation.getCurrentPosition(function(p){
      var g = wgs2gcj(p.coords.latitude, p.coords.longitude);
      var o = store(); o.home = { lat:+g.lat.toFixed(6), lng:+g.lng.toFixed(6), at:HUB.nowStamp() }; save(o);
      ME = o.home;
      $('locTip').textContent = '已定位 · 精度约 ' + Math.round(p.coords.accuracy) + ' 米';
      if (MODE === 'map') renderMap(); else renderList();
      renderNear();
      HUB.toast('已以你为中心，列表按距离排序');
    }, function(err){
      $('locTip').textContent = '';
      HUB.toast('定位失败：' + (err && err.message ? err.message : '被拒绝或不可用') + '，请在浏览器允许定位');
    }, { enableHighAccuracy:true, timeout:12000, maximumAge:60000 });
  }

  /* ---------- 图片压缩 ---------- */
  function compress(file, cb){
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var max = 720, w = img.width, h = img.height;
        var r = Math.min(1, max/Math.max(w,h));
        var c = document.createElement('canvas');
        c.width = Math.round(w*r); c.height = Math.round(h*r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = function(){ cb(''); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  /* ---------- 快速补坐标 ---------- */
  function quickPin(id){
    var it = items().filter(function(x){ return x.id === id; })[0];
    if (!it) return;
    if (typeof L === 'undefined'){
      HUB.toast('地图库还没加载好，稍等一秒再点');
      window.__loadLeaflet(function(ok){ if (ok) quickPin(id); });
      return;
    }
    var home = store().home;
    var lat = it.lat || (home && home.lat) || 23.129;
    var lng = it.lng || (home && home.lng) || 113.264;
    var z = (it.lat ? 16 : (home && home.lat ? 15 : 12));
    var m = document.createElement('div'); m.className = 'mask';
    m.innerHTML = '<div class="dlg" style="max-width:560px">'
      + '<h3>📍 给「' + HUB.esc(it.title||'这家') + '」标位置</h3>'
      + '<p class="dlg-sub">在地图上点一下那家店的位置，坐标会自动保存并立刻出现在地图上</p>'
      + (it.addr ? '<div class="mini" style="margin-bottom:6px">地址：' + HUB.esc(it.addr) + '</div>' : '')
      + '<div class="pickmap" id="pinM"></div>'
      + '<div class="mini" id="pinTxt">还没点</div>'
      + '<div class="dlg-foot"><button class="btn gray" id="pinCancel">取消</button><button class="btn" id="pinSave" disabled>保存坐标</button></div>'
      + '</div>';
    document.body.appendChild(m);
    var pk = L.map('pinM').setView([lat, lng], z);
    L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', { subdomains:['1','2','3','4'], maxZoom:19 }).addTo(pk);
    var mk = it.lat ? L.marker([it.lat, it.lng]).addTo(pk) : null;
    var picked = it.lat ? { lat: it.lat, lng: it.lng } : null;
    pk.on('click', function(e){
      picked = { lat:+e.latlng.lat.toFixed(6), lng:+e.latlng.lng.toFixed(6) };
      if (mk) pk.removeLayer(mk);
      mk = L.marker([picked.lat, picked.lng]).addTo(pk);
      $('pinTxt').textContent = '已选：' + picked.lat + ', ' + picked.lng;
      $('pinSave').disabled = false;
    });
    setTimeout(function(){ pk.invalidateSize(); }, 60);
    $('pinCancel').onclick = function(){ m.remove(); };
    m.addEventListener('click', function(e){ if (e.target === m) m.remove(); });
    $('pinSave').onclick = function(){
      if (!picked) return;
      var o = store();
      o.items = o.items.map(function(x){
        if (x.id !== id) return x;
        var y = HUB.clone(x); y.lat = picked.lat; y.lng = picked.lng; y.updatedAt = HUB.nowStamp(); return y;
      });
      save(o); m.remove();
      stat(); renderList();
      if (MODE === 'map'){ renderMap(); } else { $('tgMode').querySelector('[data-m="map"]').click(); }
      HUB.toast('坐标已存，已标到地图上');
    };
  }

  /* ---------- 编辑 ---------- */
  var KIND_OPTS = ['朋友圈','自己去吃','朋友推荐','大众点评','小红书','抖音','其他'];

  function openEditor(id){
    var all = items();
    var isNew = !id;
    var it = isNew ? {id:'', kind:'朋友圈'} : (all.filter(function(x){ return x.id === id; })[0] || {});
    var m = document.createElement('div'); m.className = 'mask';
    m.innerHTML = '<div class="dlg" style="max-width:720px;max-height:88vh;overflow:auto">'
      + '<h3>' + (isNew ? '记一家好吃的' : '编辑 · ' + HUB.esc(it.title||'') ) + '</h3>'
      + '<p class="dlg-sub">出处填谁说的（朋友圈就填发布人）、好食咩填点了什么、地址最好配上坐标，地图才能标出来</p>'
      + '<div class="pl"><label>店名 / 名称</label><input id="fTitle" value="' + HUB.esc(it.title||'') + '" placeholder="品记传承牛腩牛杂粉店"></div>'
      + '<div class="pl"><label>好食咩</label><textarea id="fWhat" rows="2" placeholder="牛筋腩啫啫猪肠粉，汤底够浓">' + HUB.esc(it.what||'') + '</textarea></div>'
      + '<div class="two"><div class="pl"><label>出处类型</label><select id="fKind">'
      + KIND_OPTS.map(function(k){ return '<option' + ((it.kind===k)?' selected':'') + '>' + k + '</option>'; }).join('')
      + '</select></div>'
      + '<div class="pl"><label>谁说的（朋友圈就填发布人）</label><input id="fFrom" value="' + HUB.esc(it.from||'') + '" placeholder="Jaycen俊"></div></div>'
      + '<div class="pl"><label>地址（写全一点）</label><input id="fAddr" value="' + HUB.esc(it.addr||'') + '" placeholder="广州市海珠区××路××号"></div>'
      + '<div class="two"><div class="pl"><label>纬度</label><input id="fLat" value="' + (it.lat||'') + '" placeholder="23.1001"></div>'
      + '<div class="pl"><label>经度</label><input id="fLng" value="' + (it.lng||'') + '" placeholder="113.3001"></div></div>'
      + '<div class="mini">没有坐标就在下面地图点一下，自动填（用的是高德坐标，点哪儿就是哪儿）</div>'
      + '<div class="pickmap" id="pickMap"></div>'
      + '<div class="two"><div class="pl"><label>人均 / 价格</label><input id="fPrice" value="' + HUB.esc(it.price||'') + '" placeholder="¥25"></div>'
      + '<div class="pl"><label>标签</label><input id="fTag" value="' + HUB.esc(it.tag||'') + '" placeholder="烧腊 / 甜品 / 早餐"></div></div>'
      + '<div class="pl"><label>备注</label><textarea id="fNote" rows="2" placeholder="排队久、周三休息…">' + HUB.esc(it.note||'') + '</textarea></div>'
      + '<div class="pl"><label>图片</label><input type="file" id="fFile" accept="image/*">'
      + '<div class="mini">上传会压缩到 720px 存进云端；也可直接粘贴图片网址 ↓</div>'
      + '<input id="fImgUrl" value="' + HUB.esc(it.img && it.img.indexOf('data:')!==0 ? it.img : '') + '" placeholder="https://…"></div>'
      + '<div id="fPrev" style="margin:8px 0">' + (it.img ? '<img class="fimg" src="' + HUB.esc(it.img) + '" style="max-height:220px">' : '') + '</div>'
      + '<div class="dlg-foot"><button class="btn gray" id="fCancel">取消</button><button class="btn" id="fSave">' + (isNew?'记下来':'保存') + '</button></div>'
      + '</div>';
    document.body.appendChild(m);

    var newImg = it.img || '';
    var lat = it.lat || '', lng = it.lng || '';
    var pk = null, pm = null;
    if (typeof L !== 'undefined'){
      pk = L.map('pickMap').setView([lat || 23.129, lng || 113.264], lat ? 16 : 12);
      L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', { subdomains:['1','2','3','4'], maxZoom:19 }).addTo(pk);
      if (lat && lng) pm = L.marker([lat,lng]).addTo(pk);
      pk.on('click', function(e){
        lat = +e.latlng.lat.toFixed(6); lng = +e.latlng.lng.toFixed(6);
        $('fLat').value = lat; $('fLng').value = lng;
        if (pm) pk.removeLayer(pm);
        pm = L.marker([lat,lng]).addTo(pk);
      });
      setTimeout(function(){ pk.invalidateSize(); }, 60);
      $('fLat').oninput = function(){ if($('fLat').value && $('fLng').value) pk.setView([+$('fLat').value, +$('fLng').value], 16); };
    } else {
      $('pickMap').innerHTML = '<div class="empty" style="padding:20px">地图库没加载，手工填经纬度即可</div>';
    }

    $('fFile').onchange = function(){
      var f = this.files && this.files[0]; if (!f) return;
      compress(f, function(d){
        if (!d){ HUB.toast('这张图读不进，换一张'); return; }
        newImg = d;
        $('fPrev').innerHTML = '<img class="fimg" src="' + d + '" style="max-height:220px">';
        HUB.toast('图片已压缩');
      });
    };
    $('fImgUrl').oninput = function(){
      if (this.value.trim()) { newImg = this.value.trim(); $('fPrev').innerHTML = '<img class="fimg" src="' + HUB.esc(newImg) + '" style="max-height:220px">'; }
    };

    $('fCancel').onclick = function(){ m.remove(); };
    m.addEventListener('click', function(e){ if (e.target === m) m.remove(); });

    $('fSave').onclick = function(){
      var t = $('fTitle').value.trim();
      if (!t){ HUB.toast('店名不能空'); return; }
      var o = store();
      var rec = {
        id: isNew ? HUB.uid() : it.id,
        title: t,
        what: $('fWhat').value.trim(),
        kind: $('fKind').value,
        from: $('fFrom').value.trim(),
        addr: $('fAddr').value.trim(),
        lat: parseFloat($('fLat').value) || '',
        lng: parseFloat($('fLng').value) || '',
        price: $('fPrice').value.trim(),
        tag: $('fTag').value.trim(),
        note: $('fNote').value.trim(),
        img: newImg,
        createdAt: isNew ? HUB.nowStamp() : (it.createdAt || HUB.nowStamp()),
        updatedAt: HUB.nowStamp()
      };
      if (isNew) o.items.unshift(rec);
      else o.items = o.items.map(function(x){ return x.id === rec.id ? rec : x; });
      save(o);
      m.remove();
      stat(); renderList(); if (MODE === 'map') renderMap();
      HUB.toast(isNew ? '已记下' : '已保存');
    };
  }

  /* ---------- 交互 ---------- */
  $('tgMode').onclick = function(e){
    var b = e.target.closest('button'); if (!b) return;
    MODE = b.dataset.m;
    Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){ x.className = (x.dataset.m === MODE) ? 'on' : ''; });
    $('viewText').style.display = MODE === 'text' ? '' : 'none';
    $('viewMap').style.display = MODE === 'map' ? '' : 'none';
    if (MODE === 'map') {
      $('map').innerHTML = '<div class="empty" style="padding:60px 20px">地图加载中…</div>';
      window.__loadLeaflet(function(ok){
        $('map').innerHTML = '';
        if (!ok){ $('map').innerHTML = '<div class="empty">地图库三个源都被挡了，切回文字模式照常用。</div>'; renderNear(); return; }
        MAP = null; renderMap();
      });
    } else { renderList(); }
  };
  $('q').oninput = function(){ Q = this.value.trim(); if (MODE === 'text') renderList(); };
  $('btnNew').onclick = function(){ openEditor(''); };
  $('btnLoc').onclick = locate;
  $('btnFit').onclick = function(){ if (MODE === 'map') renderMap(); };

  function bindList(el){
    el.addEventListener('click', function(e){
      var a = e.target.closest('.ed, .del, .big, .pin, .nav2'); if (!a) return;
      var c = e.target.closest('.fcard'); if (!c) return;
      var id = c.dataset.id;
      if (a.classList.contains('ed')) openEditor(id);
      else if (a.classList.contains('pin')) quickPin(id);
      else if (a.classList.contains('nav2')){
        var it2 = items().filter(function(x){ return x.id === id; })[0];
        if (it2 && it2.lat && it2.lng) window.open('https://uri.amap.com/marker?position=' + it2.lng + ',' + it2.lat + '&name=' + encodeURIComponent(it2.title||'美食'), '_blank');
      }
      else if (a.classList.contains('del')){
        if (!confirm('删除这条记录？')) return;
        var o = store(); o.items = o.items.filter(function(x){ return x.id !== id; }); save(o);
        stat(); renderList(); if (MODE === 'map') renderMap();
      } else {
        var it = items().filter(function(x){ return x.id === id; })[0];
        if (!it || !it.img) return;
        var m2 = document.createElement('div'); m2.className = 'mask';
        m2.innerHTML = '<div class="dlg" style="max-width:760px"><h3>' + HUB.esc(it.title||'') + '</h3>'
          + '<img class="fimg" src="' + HUB.esc(it.img) + '"><div class="dlg-foot"><button class="btn gray" id="cg">关掉</button></div></div>';
        document.body.appendChild(m2);
        m2.querySelector('#cg').onclick = function(){ m2.remove(); };
        m2.addEventListener('click', function(ev){ if (ev.target === m2) m2.remove(); });
      }
    });
  }
  bindList($('list'));
  bindList($('nearbox'));
  $('nearbox').addEventListener('click', function(e){
    if (MODE !== 'map' || !MAP) return;
    var r = e.target.closest('.nearrow'); if (!r) return;
    var it = items().filter(function(x){ return x.id === r.dataset.id; })[0];
    if (it && it.lat) MAP.setView([it.lat, it.lng], 16);
  });

  stat(); renderList();
  HUB.onRemote(function(){ stat(); if (MODE === 'map') renderMap(); else renderList(); });
})();
</script>
</body>
</html>
